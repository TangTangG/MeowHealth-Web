version: "3.8"

services:
  backend:
    build: ./backend
    container_name: meowhealth-backend
    ports:
      - "8000:8000"
    volumes:
      - meowhealth-db:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/meowhealth.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: meowhealth-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  meowhealth-db:
